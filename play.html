<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#060814">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>Arcade Retro Mobile Games</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Press+Start+2P&display=swap" rel="stylesheet">
    <style>
/* Cyber Retro Mobile Arcade Stylesheet */
:root {
    --bg-dark: #070913;
    --bg-card: #111528;
    --cyan: #00f0ff;
    --pink: #ff0055;
    --green: #00ff88;
    --gold: #ffe600;
    --purple: #9d00ff;
    --font-arcade: 'Press Start 2P', monospace;
    --font-heading: 'Orbitron', sans-serif;
}

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    user-select: none;
    -webkit-user-select: none;
    -webkit-touch-callout: none;
    touch-action: manipulation;
}

html, body {
    width: 100%;
    height: 100%;
    background-color: var(--bg-dark);
    color: #ffffff;
    font-family: var(--font-heading);
    overflow: hidden;
    display: flex;
    justify-content: center;
    align-items: center;
}

/* App Container */
.arcade-app {
    width: 100%;
    max-width: 440px;
    height: 100%;
    max-height: 840px;
    display: flex;
    flex-direction: column;
    background: radial-gradient(circle at 50% 20%, #151a38 0%, #070913 80%);
    box-shadow: 0 0 35px rgba(0, 240, 255, 0.15);
    border: 1px solid rgba(0, 240, 255, 0.2);
    border-radius: 12px;
    overflow: hidden;
    position: relative;
}

/* Header */
.arcade-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 10px 14px;
    background: rgba(10, 13, 29, 0.85);
    border-bottom: 1px solid rgba(0, 240, 255, 0.2);
    backdrop-filter: blur(8px);
}

.brand {
    display: flex;
    flex-direction: column;
}

.neon-badge {
    font-size: 8px;
    font-family: var(--font-arcade);
    color: var(--pink);
    letter-spacing: 1px;
}

.logo-text {
    font-size: 16px;
    font-weight: 900;
    color: #fff;
    text-shadow: 0 0 10px var(--cyan);
    letter-spacing: 1.5px;
}

.header-actions {
    display: flex;
    gap: 8px;
}

.icon-btn {
    background: rgba(255, 255, 255, 0.08);
    border: 1px solid rgba(0, 240, 255, 0.4);
    color: #fff;
    font-size: 14px;
    padding: 6px 9px;
    border-radius: 6px;
    cursor: pointer;
    transition: all 0.2s ease;
}

.icon-btn:active {
    transform: scale(0.9);
    background: var(--cyan);
}

/* Tabs */
.game-tabs {
    display: flex;
    gap: 4px;
    padding: 6px 10px;
    background: rgba(8, 10, 22, 0.95);
    border-bottom: 1px solid rgba(255, 255, 255, 0.08);
    overflow-x: auto;
}

.tab-btn {
    flex: 1;
    background: transparent;
    border: 1px solid transparent;
    color: #8a99b5;
    padding: 7px 4px;
    font-family: var(--font-heading);
    font-size: 11px;
    font-weight: 700;
    border-radius: 6px;
    cursor: pointer;
    white-space: nowrap;
    transition: all 0.2s;
}

.tab-btn.active {
    color: #000;
    background: var(--cyan);
    box-shadow: 0 0 12px var(--cyan);
    font-weight: 900;
}

/* Game Viewport */
.game-viewport {
    flex: 1;
    display: flex;
    flex-direction: column;
    position: relative;
    overflow: hidden;
}

/* HUD */
.hud-bar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 8px 14px;
    background: rgba(13, 17, 36, 0.9);
    border-bottom: 1px solid rgba(0, 240, 255, 0.15);
}

.hud-item {
    display: flex;
    flex-direction: column;
    align-items: center;
}

.hud-label {
    font-size: 8px;
    font-family: var(--font-arcade);
    color: #7b8ea8;
    margin-bottom: 2px;
}

.hud-val {
    font-family: var(--font-arcade);
    font-size: 12px;
    font-weight: 700;
}

.neon-cyan { color: var(--cyan); text-shadow: 0 0 8px var(--cyan); }
.neon-pink { color: var(--pink); text-shadow: 0 0 8px var(--pink); }
.neon-green { color: var(--green); text-shadow: 0 0 8px var(--green); }
.neon-gold { color: var(--gold); text-shadow: 0 0 8px var(--gold); }

/* Canvas */
.canvas-wrapper {
    flex: 1;
    display: flex;
    justify-content: center;
    align-items: center;
    position: relative;
    background: #000;
}

#game-canvas {
    width: 100%;
    height: 100%;
    display: block;
    object-fit: contain;
    touch-action: none;
}

/* Touch Controls */
.touch-controls {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 8px 16px 12px;
    background: rgba(10, 13, 26, 0.95);
    border-top: 1px solid rgba(0, 240, 255, 0.15);
    min-height: 105px;
}

.dpad {
    display: flex;
    flex-direction: column;
    align-items: center;
}

.dpad-middle {
    display: flex;
    align-items: center;
}

.dpad-center {
    width: 34px;
    height: 34px;
    background: rgba(255, 255, 255, 0.03);
}

.dpad-btn {
    width: 38px;
    height: 38px;
    background: #171c38;
    border: 1px solid var(--cyan);
    color: var(--cyan);
    font-size: 14px;
    border-radius: 8px;
    display: flex;
    justify-content: center;
    align-items: center;
    cursor: pointer;
    box-shadow: 0 0 8px rgba(0, 240, 255, 0.2);
    user-select: none;
}

.dpad-btn:active {
    background: var(--cyan);
    color: #000;
    transform: scale(0.92);
}

.action-buttons {
    display: flex;
    align-items: center;
}

.action-btn {
    background: linear-gradient(135deg, #ff0055 0%, #aa0033 100%);
    border: 1px solid #ff0055;
    color: #fff;
    padding: 12px 18px;
    border-radius: 12px;
    font-family: var(--font-heading);
    font-weight: 700;
    font-size: 12px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 4px;
    cursor: pointer;
    box-shadow: 0 0 16px rgba(255, 0, 85, 0.4);
}

.action-btn:active {
    transform: scale(0.92);
    box-shadow: 0 0 24px var(--pink);
}

.action-btn .btn-icon {
    font-size: 20px;
}

/* Modals */
.modal-overlay {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: rgba(4, 6, 15, 0.85);
    backdrop-filter: blur(6px);
    display: flex;
    justify-content: center;
    align-items: center;
    z-index: 100;
    transition: opacity 0.2s ease;
}

.modal-overlay.hidden {
    display: none;
}

.arcade-card {
    background: var(--bg-card);
    border: 2px solid var(--cyan);
    border-radius: 14px;
    padding: 24px 20px;
    width: 85%;
    max-width: 320px;
    text-align: center;
    box-shadow: 0 0 30px rgba(0, 240, 255, 0.3);
}

.modal-title {
    font-family: var(--font-arcade);
    font-size: 18px;
    margin-bottom: 20px;
}

.modal-stats {
    display: flex;
    flex-direction: column;
    gap: 12px;
    background: rgba(0, 0, 0, 0.4);
    padding: 14px;
    border-radius: 8px;
    margin-bottom: 20px;
    font-family: var(--font-arcade);
    font-size: 11px;
}

.stat-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
}

.modal-actions {
    display: flex;
    flex-direction: column;
    gap: 10px;
}

.retro-btn {
    padding: 12px 14px;
    font-family: var(--font-heading);
    font-size: 13px;
    font-weight: 700;
    border-radius: 8px;
    cursor: pointer;
    letter-spacing: 1px;
    transition: all 0.2s ease;
}

.btn-glow-pink {
    background: var(--pink);
    border: none;
    color: #fff;
    box-shadow: 0 0 16px var(--pink);
}

.btn-glow-cyan {
    background: var(--cyan);
    border: none;
    color: #000;
    box-shadow: 0 0 16px var(--cyan);
}

.btn-outline {
    background: transparent;
    border: 1px solid rgba(255, 255, 255, 0.3);
    color: #fff;
}

.retro-btn:active {
    transform: scale(0.95);
}

/* Responsiveness */
@media (max-height: 700px) {
    .touch-controls {
        min-height: 85px;
        padding: 4px 12px 8px;
    }
    .dpad-btn {
        width: 32px;
        height: 32px;
        font-size: 12px;
    }
    .dpad-center {
        width: 26px;
        height: 26px;
    }
    .action-btn {
        padding: 8px 14px;
        font-size: 11px;
    }
}

</style>
</head>
<body>
    <div class="arcade-app">
        <!-- Header / Navigation -->
        <header class="arcade-header">
            <div class="brand">
                <span class="neon-badge">RETRO 8-BIT</span>
                <h1 class="logo-text">CYBER ARCADE</h1>

        <!-- Game Over Modal -->
        <div class="modal-overlay hidden" id="gameover-modal">

                <div class="modal-stats">

                    </div>

                    </div>

                    <button id="btn-restart" class="retro-btn btn-glow-pink">PLAY AGAIN ↺</button>

        <!-- Pause Modal -->
        <div class="modal-overlay hidden" id="pause-modal">
            <div class="arcade-card modal-card">

                    <button id="btn-pause-restart" class="retro-btn btn-outline">RESTART ↺</button>
                </div>
            </div>
        </div>
    </div>
